name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-core-and-panel:
    name: Windows core and panel (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.canary }}
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            canary: false
          - runner: windows-2025
            canary: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        shell: pwsh
        run: python -m pip install uv

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts/windows-ci-evidence | Out-Null

      - name: Install Python deps
        shell: pwsh
        run: uv sync --python 3.11 --extra dev --frozen

      - name: Python lint
        shell: pwsh
        run: uv run ruff check .

      - name: Schema drift gate
        shell: pwsh
        run: |
          uv run python scripts/generate_operator_contract_schemas.py
          git diff --exit-code contracts/operator_panel/schemas

      - name: Python tests
        shell: pwsh
        run: uv run pytest -q

      - name: Provider native adapter gate
        shell: pwsh
        run: |
          uv run python scripts/generate_model_provider_contract_schemas.py
          uv run python scripts/run_provider_native_adapter_gate.py --profile enterprise --output-root artifacts/model-provider-governance/native-v2 --json
          uv run python -m imperaos provider native conformance run --profile enterprise --provider-kind anthropic_messages --offline --json
          uv run python -m imperaos provider native conformance verify --input artifacts/model-provider-governance/native-v2/anthropic_messages_native_adapter_report.json --json

      - name: Core smoke evidence
        shell: pwsh
        run: |
          uv run imperaos --version
          uv run python -m imperaos --version
          uv run imperaos operator capabilities --json |
            Tee-Object -FilePath artifacts/windows-ci-evidence/operator_capabilities.json
          uv run imperaos doctor --profile balanced --json |
            Tee-Object -FilePath artifacts/windows-ci-evidence/doctor_balanced.json

      - name: Install UI deps
        shell: pwsh
        run: pnpm install --dir apps/operator-panel --frozen-lockfile

      - name: UI tests
        shell: pwsh
        run: pnpm --dir apps/operator-panel test

      - name: UI lint
        shell: pwsh
        run: pnpm --dir apps/operator-panel lint

      - name: UI build
        shell: pwsh
        run: pnpm --dir apps/operator-panel build

      - name: Rust bridge tests
        shell: pwsh
        run: cargo test -q --manifest-path apps/operator-panel/src-tauri/Cargo.toml

      - name: Build bundled runtime
        shell: pwsh
        run: pwsh apps/operator-panel/scripts/build_bundled_runtime_windows.ps1 -Arch x64

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          $runtime = "apps/operator-panel/src-tauri/resources/imperaos-runtime"
          pwsh apps/operator-panel/scripts/verify_bundled_runtime_windows.ps1 -RuntimeDir $runtime |
            Tee-Object -FilePath artifacts/windows-ci-evidence/runtime_verify.txt
          Copy-Item "$runtime/RUNTIME_MANIFEST.txt" artifacts/windows-ci-evidence/runtime_manifest.txt

      - name: Bundle evidence hashes
        shell: pwsh
        run: |
          $items = @(
            "apps/operator-panel/src-tauri/tauri.conf.json",
            "apps/operator-panel/src-tauri/tauri.windows.conf.json",
            "apps/operator-panel/src-tauri/resources/imperaos-runtime/RUNTIME_MANIFEST.txt",
            "apps/operator-panel/src-tauri/resources/imperaos-runtime/python/Scripts/python.exe"
          )
          $hashes = foreach ($item in $items) {
            if (Test-Path -LiteralPath $item -PathType Leaf) {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $item
              [pscustomobject]@{
                path = $item
                sha256 = $hash.Hash.ToLowerInvariant()
              }
            }
          }
          $hashes | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath artifacts/windows-ci-evidence/bundle_file_hashes.json -Encoding utf8

      - name: Tauri build smoke
        shell: pwsh
        run: |
          pnpm --dir apps/operator-panel exec tauri build --debug --no-bundle *>&1 |
            Tee-Object -FilePath artifacts/windows-ci-evidence/tauri_build_smoke.txt

      - name: Upload Windows CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-evidence-${{ matrix.runner }}
          path: artifacts/windows-ci-evidence/**
