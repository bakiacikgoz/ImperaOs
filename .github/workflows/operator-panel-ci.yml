name: Operator Panel CI

on:
  push:
    paths:
      - 'apps/operator-panel/**'
      - 'imperaos/cli.py'
      - 'imperaos/control_plane/provider_*.py'
      - 'contracts/operator_panel/**'
      - 'docs/RELEASE_GATE_v0.5.md'
      - '.github/workflows/operator-panel-ci.yml'
  pull_request:
    paths:
      - 'apps/operator-panel/**'
      - 'imperaos/cli.py'
      - 'imperaos/control_plane/provider_*.py'
      - 'contracts/operator_panel/**'
      - 'docs/RELEASE_GATE_v0.5.md'
      - '.github/workflows/operator-panel-ci.yml'

jobs:
  operator-panel:
    runs-on: macos-14
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        run: pip install uv

      - name: Install Python deps
        run: uv sync --python 3.11 --extra dev

      - name: Install UI deps
        run: pnpm install --dir apps/operator-panel

      - name: Install Playwright Chromium
        run: pnpm --dir apps/operator-panel exec playwright install chromium

      - name: UI frontend QA
        run: pnpm --dir apps/operator-panel qa:frontend

      - name: Provider workflow proof e2e
        run: pnpm --dir apps/operator-panel test:e2e -- provider-workflow-proof.spec.ts

      - name: Publish UI QA summary
        if: always()
        run: |
          if [ -f artifacts/operator-panel-ui/qa-summary.md ]; then
            cat artifacts/operator-panel-ui/qa-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-panel-ui-qa
          path: artifacts/operator-panel-ui/**
          if-no-files-found: warn

      - name: Rust bridge tests
        run: cargo test -q --manifest-path apps/operator-panel/src-tauri/Cargo.toml

      - name: Capabilities command smoke
        run: uv run imperaos operator capabilities --json
