name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: ImperaOS brand consistency gate
        run: make brand-consistency-gate

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run --extra dev python -m pytest -q

      - name: Config resolve gate
        run: uv run imperaos config resolve --profile balanced --json

      - name: Provider governance gates
        env:
          IMPERAOS_PROVIDER_LIVE_CANARY_OPT_IN: "0"
        run: |
          make provider-native-gate
          make provider-runtime-gate
          make provider-workflow-proof-gate
          make design-partner-rc-audit-gate

      - name: Write test summary artifact
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          payload = {
              "artifact": "test_summary",
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "status": "ok",
              "data": {"ci": "github_actions", "tests": "passed"},
          }
          with open("artifacts/test_summary.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          PY

      - name: Smoke benchmark gate
        run: uv run imperaos benchmark smoke --mode A --profile balanced --task-limit 1

  pilot-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Targeted pilot gate tests
        run: |
          uv run pytest -q \
            tests/test_team_bounded_concurrency.py \
            tests/test_team_governance.py \
            tests/test_team_memory_fail_closed.py \
            tests/test_team_audit_envelope.py \
            tests/test_team_cli.py \
            tests/test_team_pilot_gate.py

      - name: Team runtime pilot gate
        run: |
          uv run imperaos team validate --spec examples/team/restricted_pilot.yaml --json
          uv run imperaos team pilot-check \
            --spec examples/team/restricted_pilot.yaml \
            --profile restricted \
            --mode deterministic \
            --report artifacts/team_pilot_report.json \
            --json

  enterprise-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Enterprise CLI tests
        run: uv run python -m pytest -q tests/test_enterprise_cli.py tests/test_enterprise_qualification.py

      - name: Prepare enterprise fixture
        run: |
          rm -rf .imperaos/enterprise/keys .imperaos/enterprise/identity
          rm -f artifacts/qualification_report.json artifacts/QUALIFICATION_REPORT.md
          uv run python scripts/prepare_enterprise_fixture.py --root .

      - name: Enterprise baseline and GA readiness
        run: |
          uv run imperaos security baseline --profile enterprise --json
          uv run imperaos auth whoami --profile enterprise --json
          uv run imperaos auth check --profile enterprise --permission runtime.run --json
          uv run imperaos keys verify --profile enterprise --path artifacts/security_posture.json --json
          uv run imperaos metrics snapshot --profile enterprise --json
          uv run imperaos ga readiness --profile enterprise --report artifacts/ga_readiness_report.json --json
          uv run imperaos keys verify --profile enterprise --path artifacts/ga_readiness_report.json --json
          uv run imperaos support bundle export --profile enterprise --json

  provider-governance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Provider governance tests
        run: |
          uv run --extra dev python scripts/generate_model_provider_contract_schemas.py
          uv run --extra dev python -m pytest -q \
            tests/test_model_provider_contracts.py \
            tests/test_model_provider_registry.py \
            tests/test_model_provider_policy.py \
            tests/test_model_provider_redaction.py \
            tests/test_model_provider_envelope.py \
            tests/test_model_provider_openai_compatible.py \
            tests/test_model_provider_cli.py \
            tests/test_model_provider_no_secret_leak.py \
            tests/test_model_provider_budget.py \
            tests/test_model_provider_network_guard.py \
            tests/test_model_provider_canary_evidence.py \
            tests/test_model_provider_canary.py \
            tests/test_model_provider_router_shadow.py \
            tests/test_model_provider_native_contracts.py \
            tests/test_model_provider_tool_policy.py \
            tests/test_openai_responses_adapter.py \
            tests/test_provider_native_anthropic_messages.py \
            tests/test_provider_conformance_matrix.py \
            tests/test_provider_native_adapter_gate.py \
            tests/test_provider_native_adapter_contract.py \
            tests/test_provider_governance_gate.py

      - name: Provider governance gate and evidence
        run: |
          uv run --extra dev python scripts/run_provider_governance_gate.py --profile enterprise --json
          uv run --extra dev python scripts/run_provider_canary_fixture.py --profile enterprise --json
          uv run --extra dev python scripts/generate_provider_canary_evidence.py --profile enterprise --json
          uv run --extra dev python -m imperaos provider canary verify --evidence-root artifacts/model-provider-governance/canary --json
          uv run --extra dev python scripts/generate_model_provider_governance_evidence.py --profile enterprise --json
          uv run --extra dev python scripts/generate_provider_conformance_matrix.py --profile enterprise --mode offline --output-root artifacts/model-provider-governance/conformance --json
          uv run --extra dev python scripts/verify_provider_release_closure.py --profile enterprise --evidence-root artifacts/model-provider-governance/v1_1 --json
          uv run --extra dev python scripts/run_provider_native_adapter_gate.py --profile enterprise --output-root artifacts/model-provider-governance/native-v2 --json
          uv run --extra dev python -m imperaos provider native conformance run --profile enterprise --provider-kind anthropic_messages --offline --json
          uv run --extra dev python -m imperaos provider native conformance verify --input artifacts/model-provider-governance/native-v2/anthropic_messages_native_adapter_report.json --json

  provider-governance-windows-script:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Provider governance script gate
        shell: pwsh
        run: |
          uv run --extra dev python scripts/generate_model_provider_contract_schemas.py
          uv run --extra dev python scripts/run_provider_governance_gate.py --profile enterprise --json
          uv run --extra dev python scripts/run_provider_canary_fixture.py --profile enterprise --json
          uv run --extra dev python -m imperaos provider canary verify --evidence-root artifacts/model-provider-governance/canary --json
          uv run --extra dev python scripts/generate_provider_conformance_matrix.py --profile enterprise --mode offline --output-root artifacts/model-provider-governance/conformance --json
          uv run --extra dev python scripts/verify_provider_release_closure.py --profile enterprise --evidence-root artifacts/model-provider-governance/v1_1 --json
          uv run --extra dev python scripts/run_provider_native_adapter_gate.py --profile enterprise --output-root artifacts/model-provider-governance/native-v2 --json
          uv run --extra dev python -m imperaos provider native conformance run --profile enterprise --provider-kind anthropic_messages --offline --json
          uv run --extra dev python -m imperaos provider native conformance verify --input artifacts/model-provider-governance/native-v2/anthropic_messages_native_adapter_report.json --json
