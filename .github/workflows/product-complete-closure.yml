name: Product Complete Closure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  artifact-workspace-release:
    uses: ./.github/workflows/artifact-workspace-ci.yml

  backend-product-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev
      - name: Product-complete Python tests
        run: |
          uv run --extra dev ruff check \
            imperaos/cli.py \
            imperaos/release/product_complete.py \
            scripts/run_product_complete_scope_gate.py \
            scripts/run_assistant_real_runtime_gate.py \
            scripts/run_first_run_readiness_gate.py \
            scripts/run_governed_agent_workflow_product_gate.py \
            scripts/run_product_complete_closure_gate.py
          uv run --extra dev python -m pytest -q \
            tests/test_assistant_cli.py \
            tests/test_assistant_real_runtime_gate.py \
            tests/test_product_complete_scope_gate.py \
            tests/test_first_run_setup_cli.py \
            tests/test_first_run_readiness_gate.py \
            tests/test_product_demo_cli.py \
            tests/test_governed_agent_workflow_product_gate.py \
            tests/test_product_support_bundle_redaction.py \
            tests/test_product_complete_closure_gate.py

  operator-panel-product-complete:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - name: Install dependencies
        run: corepack pnpm --dir apps/operator-panel install --frozen-lockfile
      - name: Operator Panel product-complete static checks
        run: |
          corepack pnpm --dir apps/operator-panel exec vitest run \
            src/routeCapabilityMatrix.test.ts \
            src/routeRegistry.test.ts
          corepack pnpm --dir apps/operator-panel exec tsx \
            scripts/assert-no-inert-primary-actions.ts
          corepack pnpm --dir apps/operator-panel build

  product-complete-closure-report:
    runs-on: ubuntu-latest
    needs:
      - artifact-workspace-release
      - backend-product-complete
      - operator-panel-product-complete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev
      - name: Generate closure report
        run: |
          uv run python scripts/run_product_complete_closure_gate.py \
            --profile enterprise \
            --output-root artifacts/product-complete-closure \
            --json
      - uses: actions/upload-artifact@v4
        with:
          name: product-complete-closure
          path: artifacts/product-complete-closure/
