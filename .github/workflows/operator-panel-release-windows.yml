name: Operator Panel Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'operator-panel-v*'

permissions:
  contents: read
  actions: read

jobs:
  release-windows:
    runs-on: windows-2022
    timeout-minutes: 75
    environment: release-windows

    steps:
      - name: Validate Windows signing credentials
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-release-evidence | Out-Null
          $preflightPath = "artifacts/windows-release-evidence/credential-preflight.json"
          $missingSecrets = @()
          $blockingReasons = @()

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_B64)) {
            $missingSecrets += "WINDOWS_SIGNING_CERT_PFX_B64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            $missingSecrets += "WINDOWS_SIGNING_CERT_PASSWORD"
          }

          $status = "pass"
          if ($missingSecrets.Count -gt 0) {
            $status = "blocked_external_credentials"
            $blockingReasons += "windows_signing_credentials_missing"
          }

          @{
            schemaVersion = "windows-release-credential-preflight/v1"
            platform = "windows"
            artifact_type = "nsis"
            status = $status
            blocking_reasons = @($blockingReasons)
            missing_signing_secret_names = @($missingSecrets)
            timestamp_url_configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)
            secret_material_written = $false
            signed = $false
            timestamped = $false
            signtool_verify_status = "not_run"
            signed_rc_allowed = $false
            created_at_utc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $preflightPath -Encoding utf8

          if ($status -ne "pass") {
            throw "Windows credential preflight blocked: $($blockingReasons -join ', ')"
          }

          "windows_credential_preflight=pass" >> $env:GITHUB_OUTPUT

      - name: Upload Windows credential preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-panel-windows-credential-preflight
          path: artifacts/windows-release-evidence/credential-preflight.json

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        shell: pwsh
        run: python -m pip install uv

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        shell: pwsh
        run: uv sync --python 3.11 --extra dev --frozen

      - name: Install UI deps
        shell: pwsh
        run: pnpm install --dir apps/operator-panel --frozen-lockfile

      - name: Create release evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-release-evidence | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/windows-public-release-gate | Out-Null

      - name: Build bundled runtime
        shell: pwsh
        run: pwsh apps/operator-panel/scripts/build_bundled_runtime_windows.ps1 -Arch x64

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          $runtime = "apps/operator-panel/src-tauri/resources/imperaos-runtime"
          pwsh apps/operator-panel/scripts/verify_bundled_runtime_windows.ps1 -RuntimeDir $runtime |
            Tee-Object -FilePath artifacts/windows-release-evidence/runtime_verify.txt
          Copy-Item "$runtime/RUNTIME_MANIFEST.txt" artifacts/windows-release-evidence/runtime_manifest.txt

      - name: Build unsigned NSIS artifact
        shell: pwsh
        run: |
          pnpm --dir apps/operator-panel build
          pnpm --dir apps/operator-panel exec tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Evaluate signing gate and sign when configured
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $statusPath = "artifacts/windows-release-evidence/windows-release-status.json"
          $nsisArtifacts = @(Get-ChildItem -Path "apps/operator-panel/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -Recurse)
          if ($nsisArtifacts.Count -eq 0) {
            throw "No NSIS artifact found"
          }
          $unsignedArtifactRecords = @($nsisArtifacts | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            [pscustomobject]@{
              name = $_.Name
              sha256 = $hash.Hash.ToLowerInvariant()
            }
          })
          $primaryInstallerHash = $null
          if ($unsignedArtifactRecords.Count -gt 0) {
            $primaryInstallerHash = $unsignedArtifactRecords[0].sha256
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            @{
              schemaVersion = "windows-release-status/v1"
              platform = "windows"
              artifact_type = "nsis"
              artifact_kind = "nsis"
              signed = $false
              timestamped = $false
              signtool_verify_status = "not_run"
              signed_rc_allowed = $false
              status = "blocked_external_credentials"
              reason = "missing_windows_signing_secret"
              artifact_sha256 = $primaryInstallerHash
              installer_sha256 = $primaryInstallerHash
              secret_material_written = $false
              temp_certificate_removed = $true
              artifacts = @($unsignedArtifactRecords)
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $statusPath -Encoding utf8
            "signed=false" >> $env:GITHUB_OUTPUT
            "signed_rc_allowed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.pfx"
          $signingEvidenceDir = "artifacts/windows-release-evidence/signing"
          New-Item -ItemType Directory -Force -Path $signingEvidenceDir | Out-Null
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX_B64))
          $artifactRecords = @()
          $tempCertificateRemoved = $false
          try {
            foreach ($artifact in $nsisArtifacts) {
              $safeEvidenceName = "$($artifact.BaseName)-signing.json"
              $signingEvidencePath = Join-Path $signingEvidenceDir $safeEvidenceName
              pwsh apps/operator-panel/scripts/sign_windows_artifacts.ps1 `
                -ArtifactPath $artifact.FullName `
                -CertPfxPath $pfxPath `
                -CertPassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
                -EvidencePath $signingEvidencePath

              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName
              $artifactRecords += [pscustomobject]@{
                name = $artifact.Name
                sha256 = $hash.Hash.ToLowerInvariant()
                signing_evidence = $signingEvidencePath
              }
            }
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            $tempCertificateRemoved = -not (Test-Path -LiteralPath $pfxPath)
          }

          $primaryInstallerHash = $null
          if ($artifactRecords.Count -gt 0) {
            $primaryInstallerHash = $artifactRecords[0].sha256
          }
          @{
            schemaVersion = "windows-release-status/v1"
            platform = "windows"
            artifact_type = "nsis"
            artifact_kind = "nsis"
            signed = $true
            timestamped = $true
            signtool_verify_status = "pass"
            signed_rc_allowed = $true
            status = "blocked_external_smoke"
            reason = "clean_vm_smoke_missing"
            timestamp_url_configured = $true
            temp_certificate_removed = $tempCertificateRemoved
            artifact_sha256 = $primaryInstallerHash
            installer_sha256 = $primaryInstallerHash
            secret_material_written = $false
            artifacts = @($artifactRecords)
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $statusPath -Encoding utf8
          "signed=true" >> $env:GITHUB_OUTPUT
          "signed_rc_allowed=true" >> $env:GITHUB_OUTPUT

      - name: Hash NSIS artifacts
        shell: pwsh
        run: |
          [object[]]$hashes = @(Get-ChildItem -Path "apps/operator-panel/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -Recurse |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              [pscustomobject]@{
                path = $_.FullName
                sha256 = $hash.Hash.ToLowerInvariant()
              }
            })
          ConvertTo-Json -InputObject $hashes -Depth 3 |
            Set-Content -LiteralPath artifacts/windows-release-evidence/nsis_file_hashes.json -Encoding utf8

      - name: Evaluate Windows public release gate
        shell: pwsh
        run: |
          uv run python scripts/evaluate_windows_release_gate.py `
            --release-status artifacts/windows-release-evidence/windows-release-status.json `
            --installer-smoke artifacts/windows-installer-smoke/windows-installer-smoke.json `
            --operator-capabilities artifacts/windows-installer-smoke/operator_capabilities.json `
            --doctor artifacts/windows-installer-smoke/doctor_balanced.json `
            --runtime-manifest artifacts/windows-release-evidence/runtime_manifest.txt `
            --bundle-hashes artifacts/windows-release-evidence/nsis_file_hashes.json `
            --output artifacts/windows-public-release-gate/windows-public-release-gate.json

      - name: Upload unsigned CI smoke artifacts
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: operator-panel-windows-unsigned-ci-smoke
          path: |
            apps/operator-panel/src-tauri/target/release/bundle/nsis/**
            artifacts/windows-release-evidence/**
            artifacts/windows-public-release-gate/**

      - name: Upload signed release-candidate artifacts
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: operator-panel-windows-signed-release-candidate
          path: |
            apps/operator-panel/src-tauri/target/release/bundle/nsis/**
            artifacts/windows-release-evidence/**
            artifacts/windows-public-release-gate/**
