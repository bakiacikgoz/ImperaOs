[app]
model_name = "lfm2.5-thinking:1.2b"
profile_name = "default"
llm_provider = "auto"
fallback_provider = "transformers"
fallback_enabled = true
hf_model_id = "distilgpt2"
device = "cpu"
router_mode = "rule"
shadow_router_enabled = false
shadow_router_mode = "sltc"
planner_temperature = 0.0
answer_temperature = 0.2
router_confidence_threshold = 0.6
latency_budget_ms = 4000
debug_mode = false
privacy_mode = true
enable_persistent_memory = false
memory_ttl_days = 30
fast_path_regret_window = 2
fast_path_regret_threshold = 0.2
env_prefix = "IMPERAOS"
web_enabled = false
workspace_root = "."
trace_dir = ".imperaos/traces"
router_dataset_path = ".imperaos/research/router_dataset.jsonl"

[limits]
expert_timeout_ms = 2500
max_retries = 1
circuit_breaker_threshold = 3
circuit_breaker_cooldown_s = 300
llm_timeout_ms = 60000
max_tool_calls = 4
max_recursion_depth = 3

[sltc]
enabled = false
router_mode = "shadow"
decay = 0.82
spike_threshold = 0.55
confidence_threshold = 0.6
failure_penalty_weight = 0.35
latency_penalty_weight = 0.12
need_bonus = 0.12
conf_bonus = 0.2
task_bias_overrides = {}

[memory]
db_path = ".imperaos/memory.sqlite3"
v3_enabled = false
v3_authority_mode = "local"
raw_prompt_persistence = false
raw_response_persistence = false
raw_content_artifacts = false
primary_ui_raw_content = false
semantic_index_enabled = true
semantic_index_backend = "sqlite_text"
turbovec_experimental_enabled = false
turbovec_bits_per_coord = 4
turbovec_dim_guard_max = 4096
salience_threshold = 0.62
salience_decay = 0.82
max_rows = 5000
context_top_k = 4
expert_bonus = 0.06
task_bonus = 0.08
spike_reduction = 0.5
rank_salience_weight = 0.7
rank_recency_weight = 0.3

[memory.runtime]
policy_enforcement_enabled = false
semantic_runtime_mode = "disabled"
enabled = false
context_top_k = 4
max_context_chars = 4000
post_run_write_enabled = false
post_run_default_scope = "personal"
strict_fail_closed_profiles = ["enterprise", "restricted"]

[memory.sync]
enabled = false
export_raw_content = false
import_apply_requires_approval = true
allow_cross_environment_import = false

[memory.workspace_authority]
enabled = false
mode = "local"
default_workspace_id = "default"
default_principal_id = "agent-local"
db_path = ".imperaos/workspace_memory.sqlite3"
raw_content_persistence = false
network_listener_enabled = false
migration_apply_enabled = false

[memory.semantic]
enabled = false
runtime_injection_enabled = false
backend = "in_memory_fixture"
embedding_profile = "deterministic-fixture-v1"
max_hits = 8
allow_stale_index = false
raw_persistence = false

[memory.semantic.backends.turbovec]
enabled = false
experimental = true
bit_width = 4
allow_runtime_injection = false

[memory.keyword_weights]
remember = 0.18
"hatırla" = 0.18
plan = 0.12
"adım" = 0.12
deadline = 0.1
todo = 0.1
bug = 0.12
hata = 0.12
important = 0.16
"önemli" = 0.16

[planner]
repair_enabled = true
repair_max_attempts = 1
prompt_variant = "strict_v2"

[code_verify]
enabled = true
lint_enabled = true
test_collect_enabled = true
targeted_tests_enabled = false
timeout_s = 15
retry_max = 1
retry_strategy = "failure_aware"

[governance]
enabled = true
policy_path = "config/policies/default.toml"
policy_fail_mode = "fail_closed"
approval_store_path = ".imperaos/governance/approvals.sqlite3"
audit_dir = ".imperaos/audit"
pii_redaction_enabled = true
approval_ttl_seconds = 86400
decision_engine_version = "v0.3"

[team]
enabled = true
max_parallel_tasks = 4
max_total_tasks = 64
max_handoff_depth = 8
checkpoint_db_path = ".imperaos/team/checkpoints.sqlite3"
artifact_dir = ".imperaos/team/jobs"

[computer_use]
enabled = true
runtime_mode = "legacy_pilot"
vision_enabled = false
vision_provider = "none"
vision_model = ""
vision_provider_timeout_s = 30.0
vision_provider_max_retries = 1
default_mode = "step_approval"
max_steps = 50
max_recovery_attempts = 3
screenshot_interval_ms = 750
min_action_confidence = 0.82
min_verification_confidence = 0.80
macos_live_enabled = false
macos_capture_backend = "disabled"
macos_input_backend = "disabled"
macos_primary_display_only = true
macos_require_fresh_qualification = true
macos_qualification_report = ""
macos_max_steps = 25
macos_step_delay_ms = 150
macos_require_step_approval = true
windows_live_enabled = false
windows_capture_backend = "disabled"
windows_input_backend = "disabled"
linux_live_enabled = false
linux_capture_backend = "disabled"
linux_input_backend = "disabled"
action_set = ["move_mouse", "click", "double_click", "scroll", "wait"]
require_approval_for_type_text = true
require_approval_for_hotkey = true
require_approval_for_download = true
require_approval_for_upload = true
max_action_duration_ms = 5000
post_action_observe_delay_ms = 500
approval_snapshot_max_age_ms = 10000
raw_screenshot_persistence = false
raw_screenshot_retention = "disabled"
raw_screenshot_max_count = 0
allowed_apps = []
blocked_apps = ["System Settings", "Settings", "Keychain Access", "Password Manager"]
terminal_control = "deny"
sensitive_surface_policy = "stop"
platform_qualification_required = true
