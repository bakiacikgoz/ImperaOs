[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "imperaos"
version = "0.4.1"
description = "ImperaOS governed AI workforce operating platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "ImperaOS Contributors" }
]
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
  "typer>=0.17.0,<1.0.0",
  "rich>=14.0.0,<15.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "ollama>=0.5.0,<1.0.0",
  "psutil>=6.1.0,<7.0.0",
  "cryptography>=44.0.0,<46.0.0",
  "editables>=0.3,<1.0",
  "jsonschema>=4.23.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]
hf = [
  "transformers>=4.45.0,<5.0.0",
  "torch>=2.4.0,<3.0.0",
]

[project.scripts]
imperaos = "imperaos.cli:app"
binliquid = "binliquid.__main__:main"
aegis = "binliquid.__main__:main"

[tool.hatch.build.targets.wheel]
dev-mode-exact = true
packages = ["imperaos", "binliquid", "benchmarks", "research", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"branding/identity.json" = "imperaos/identity.json"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/imperaos",
  "/binliquid",
  "/benchmarks",
  "/research",
  "/scripts",
  "/config",
  "/branding/identity.json",
  "/hatch_build.py",
  "/pyproject.toml",
  "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
